services:
  db:
    image: postgres:16-bookworm
    container_name: medivision_pg_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medivision_dev}
      POSTGRES_USER: ${POSTGRES_USER:-medivision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medivision_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medivision} -d ${POSTGRES_DB:-medivision_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev: